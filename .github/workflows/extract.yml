name: Hourly Auction Extractor

on:
  schedule:
    # Runs every 30 minutes for the scout strategy
    - cron: '14,44 * * * *'
  # Adds the button to run it manually
  workflow_dispatch: 

jobs:
  extract-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Extraction Script
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # Add this line!
        run: python fetch.py
