name: Hourly Auction Extractor

on:
  workflow_dispatch:

# Never run two extractions at once: overlapping runs could write the same hour_HH_MM file
# and race on the pending-copy manifests. A newer queued run replaces an older queued one.
concurrency:
  group: auction-extract
  cancel-in-progress: false

jobs:
  extract-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Extraction Script
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Optional: add a DISCORD_WEBHOOK_URL repository secret to get failure alerts. Unset = no alerts.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python fetch.py
