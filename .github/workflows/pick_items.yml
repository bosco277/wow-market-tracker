name: Market tools

# One-click tools that read your recent commodity snapshots from the Hugging Face mirror (NOT Backblaze, so your B2
# download cap is untouched). Put this file in .github/workflows/ . Run it from the Actions tab -> "Market tools".
# Choose a mode:
#   pick   writes the shortlist of items for the buy/list experiment
#   files  lists the files that exist, day by day, and which hours are missing (downloads nothing)
#   inspect downloads each DAILY file and shows what is inside it (columns, empty cells, one line per snapshot time)
#   rates  one line per item id you type in: our estimated units sold per day, price and depth (use days=4)
#   market  per item id: price bands, TSM-style value, price wall, flip shelf (use days=8)
#   profile per item id: hour-of-day table and day-of-week grid of price and quantity (use days=8)
#   plan   only counts files and MB (downloads nothing)
#   order  checks whether the newest or the oldest listing at a price is bought first
#   item   hourly price, depth and estimated sales for the item ids you type in
#   flips  finds market flips (cheap side bought out, price jumped) in the last few days and what followed
#   derive  builds the small tables the new front end reads (use days=4; tick upload to publish them to the HF repo)
#   backtest  replays the flip screener on past hours and shows what happened next (use days=8; tick upload to show it in the app)
#   reconcile  checks your experiment log (a CSV in the repo, see log_path) against the snapshots (use days=8)
#   daily  adds days to the permanent per-item daily history (engine/item_daily): days = how many days to read (7), end_date = last day (blank = today); tick upload.
#          Run it again with an earlier end_date to backfill. The group test's lifting-together part needs 14+ days of it.
#          From v0.7.26 each day also stores two depth-based prices (price_p15 / price_p30); rerun the days you want them for.
#   grouptest  leave-one-out test of the groups: which ones predict an item better than its family or all items, and what splits the coarse ones
#   undermine  pulls years of DAILY price and units-listed history from Undermine Exchange for a balanced sample of items (needs the UNDERMINE_API_KEY
#              secret; 3 points per item, 3,000 per hour). Tick upload. Run again about an hour later until it says all sampled items are done.
#              Stored only in the private dataset; nothing from it goes into a downloadable file.
#   undermine_check  fetches Undermine's HOURLY rows for ~40 items and compares them with our own (units, feed, does their stock change track our
#              sales estimate). Needs derive's tables in the private dataset. About 120 points. Prints summary numbers only.
#   undermine_test  part 4 of the group test on the stored Undermine history: weekday rhythm of price and stock, whether groups move together over years,
#              and how fresh items settle after they first appear. Group-level numbers only; no points used; no files saved.
#   api_probe  asks Blizzard's Game Data API whether a WoW Forever namespace exists yet (camelot, forever, classicplus ... next to the known ones and a
#              made-up one). Prints status codes and field names only. Add your own guesses as words in item_ids (e.g. camelot2,fvus). No files saved.
#   ahledger_check  finds out what AHLedger's open API offers: its own description, the endpoints and their parameters, and the shape of a few answers.
#              At most 30 requests, one per second. Prints shapes only. No files saved.
#   launch_backtest  the launch forecaster, tested on launches it has not seen: from an item's first days, guess its settled price and stock with a measured range. Reads
#              the stored Undermine history; tick upload to keep the prior table (engine/launch_prior) for launch_now and for Forever. Group-level numbers only.
#   launch_now  applies that prior to items that are young in OUR daily table (engine/item_daily): settled-price range per family and for the most-listed young items.
#              On Forever: run daily from launch day, then this. No files saved.
#   forecast_test  the forecast bake-off on SETTLED items: guess price (and units listed) 1, 3 and 7 days ahead with simple methods (yesterday's value, averages, a weekday
#              pattern, a pooled regression with and without group peers), grade each against what happened, and say whether the error bars hold. Reads the stored
#              Undermine history; no points used; group-level numbers only; no files saved. SARIMA is left out unless the word sarima is in item_ids.
#   target_test  compares Undermine's daily price (lowest price at one snapshot) with ours (median of the day's hourly lowest prices) on the days they share: how big the
#              daily moves are, and how many of Undermine's big moves ours also makes. Also compares our floor with depth-based prices (the price of the cheapest 15% / 30%
#              of the units listed) once mode daily has stored them (v0.7.26 on). Needs item_daily (mode daily, upload ticked); the Undermine part also needs the Undermine
#              history. No files saved.
#   forecast_hourly  the same bake-off on OUR OWN hourly snapshots (the last reading in each US Eastern clock hour, for the items in engine/items): guess price and units
#              listed 1, 4, 12 and 24 hours ahead, with an hour-of-day pattern as a candidate, and say whether the items share a daily cycle. Only the days of hourly snapshots
#              you have exist (set days to about 14), so the first results are PRELIMINARY. Reads the snapshots like mode daily; no points used; group-level numbers only;
#              no files saved.
#   groups  builds the item-groups table (class, subclass, vendor price) from Blizzard's item data; use item_ids to add items; tick upload to publish it
#   ledger  reads your Journalator.lua from the PRIVATE dataset (log_path = hf:system/Journalator.lua): real profit per flip, deposits, every
#           listing's outcome. Needs no snapshots. Names are never printed; tick upload to store the tables in engine/ of the private dataset

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [pick, market, profile, rates, files, inspect, plan, order, item, flips, reconcile, derive, backtest, ledger, groups, grouptest, daily, undermine, undermine_check, undermine_test, api_probe, ahledger_check, launch_backtest, launch_now, forecast_test, target_test, forecast_hourly]
        default: pick
      days:
        description: "How many days of data to load (pick looks back 72 h, so 4 or more)"
        default: "4"
      item_ids:
        description: "For mode=item: item ids separated by commas (e.g. 192841,42253). For api_probe: extra namespace guesses as words (e.g. camelot2,fvus). For forecast_test: the word sarima adds SARIMA (slow)"
        default: ""
      max_position_gold:
        description: "pick: most gold in play for any one item"
        default: "150"
      min_floor_gold:
        description: "pick: skip items cheaper than this (gold per unit)"
        default: "1"
      max_units:
        description: "pick: most units to buy for any one item"
        default: "300"
      n_items:
        description: "pick: how many items to shortlist"
        default: "6"
      trade_units:
        description: "market: the biggest trade you would make, in units"
        default: "500"
      horizon_hours:
        description: "market: hours of sales the price wall must cover"
        default: "4"
      log_path:
        description: "reconcile: your experiment log CSV in the repo; ledger: hf:system/Journalator.lua (the file in your private dataset)"
        default: "experiment_log.csv"
      end_date:
        description: "daily/derive/etc: last UTC date to read, YYYY-MM-DD (blank = today). Use an earlier date to backfill with daily."
        default: ""
      batch:
        description: "undermine: most items to fetch in one run (3 points each; 800 = 2,400 of the 3,000 points per hour)"
        default: "800"
      upload:
        description: "derive/daily/undermine: publish the tables to engine/ in the HF repo (one commit)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pandas numpy pyarrow requests tabulate huggingface_hub boto3 scipy

      # Downloaded snapshot files are kept between runs. They are saved even if the run fails or times out, so a retry
      # does not start the downloads from zero.
      - name: Restore downloaded files
        uses: actions/cache/restore@v4
        with:
          path: .lake_cache
          key: lake-cache-${{ github.run_id }}
          restore-keys: lake-cache-

      - name: Run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          UNDERMINE_API_KEY: ${{ secrets.UNDERMINE_API_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          MODE: ${{ inputs.mode }}
          DAYS: ${{ inputs.days }}
          IDS: ${{ inputs.item_ids }}
          MAXPOS: ${{ inputs.max_position_gold }}
          MINFLOOR: ${{ inputs.min_floor_gold }}
          MAXUNITS: ${{ inputs.max_units }}
          NITEMS: ${{ inputs.n_items }}
          TRADE: ${{ inputs.trade_units }}
          HORIZON: ${{ inputs.horizon_hours }}
          LOGPATH: ${{ inputs.log_path }}
          UPLOAD: ${{ inputs.upload }}
          END: ${{ inputs.end_date }}
          BATCH: ${{ inputs.batch }}
        run: |
          mkdir -p out
          EXTRA=""
          if [ "$UPLOAD" = "true" ]; then EXTRA="--upload"; fi
          if [ -n "$END" ]; then EXTRA="$EXTRA --end $END"; fi
          python tools/lake.py "$MODE" $EXTRA --store hf --days "$DAYS" --ids "$IDS" --max-position-gold "$MAXPOS" --min-floor-gold "$MINFLOOR" --max-units "$MAXUNITS" --n-items "$NITEMS" --trade-units "$TRADE" --horizon-hours "$HORIZON" --log "$LOGPATH" --batch "$BATCH" | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save downloaded files
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .lake_cache
          key: lake-cache-${{ github.run_id }}

      - name: Save results
        # the ledger is personal, and Undermine data is not ours to republish: both go only to the private dataset, never to a downloadable file
        if: ${{ inputs.mode != 'ledger' && inputs.mode != 'undermine' && inputs.mode != 'undermine_check' && inputs.mode != 'undermine_test' && inputs.mode != 'api_probe' && inputs.mode != 'ahledger_check' && inputs.mode != 'launch_backtest' && inputs.mode != 'launch_now' && inputs.mode != 'forecast_test' && inputs.mode != 'target_test' && inputs.mode != 'forecast_hourly' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-tools-results
          path: |
            out/
            out.txt
