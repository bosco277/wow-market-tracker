name: Market tools

# One-click tools that read your recent commodity snapshots from the Hugging Face mirror (NOT Backblaze, so your B2
# download cap is untouched). Put this file in .github/workflows/ . Run it from the Actions tab -> "Market tools".
# Choose a mode:
#   pick   writes the shortlist of items for the buy/list experiment
#   files  lists the files that exist, day by day, and which hours are missing (downloads nothing)
#   inspect downloads each DAILY file and shows what is inside it (columns, empty cells, one line per snapshot time)
#   plan   only counts files and MB (downloads nothing)
#   order  checks whether the newest or the oldest listing at a price is bought first
#   item   hourly price, depth and estimated sales for the item ids you type in
#   flips  finds market flips (cheap side bought out, price jumped) in the last few days and what followed

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [pick, files, inspect, plan, order, item, flips]
        default: pick
      days:
        description: "How many days of data to load (pick looks back 72 h, so 4 or more)"
        default: "4"
      item_ids:
        description: "For mode=item: item ids separated by commas (e.g. 192841,42253)"
        default: ""
      max_position_gold:
        description: "pick: most gold in play for any one item"
        default: "150"
      min_floor_gold:
        description: "pick: skip items cheaper than this (gold per unit)"
        default: "1"
      max_units:
        description: "pick: most units to buy for any one item"
        default: "300"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pandas numpy pyarrow requests tabulate

      - name: Keep downloaded files between runs
        uses: actions/cache@v4
        with:
          path: .lake_cache
          key: lake-cache-${{ github.run_id }}
          restore-keys: lake-cache-

      - name: Run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          MODE: ${{ inputs.mode }}
          DAYS: ${{ inputs.days }}
          IDS: ${{ inputs.item_ids }}
          MAXPOS: ${{ inputs.max_position_gold }}
          MINFLOOR: ${{ inputs.min_floor_gold }}
          MAXUNITS: ${{ inputs.max_units }}
        run: |
          mkdir -p out
          python tools/lake.py "$MODE" --store hf --days "$DAYS" --ids "$IDS" --max-position-gold "$MAXPOS" --min-floor-gold "$MINFLOOR" --max-units "$MAXUNITS" | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: market-tools-results
          path: |
            out/
            out.txt
